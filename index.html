<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parcel.OS Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#f5f0e6",
                        surface: "#ffffff",
                        "surface-alt": "#e8e2d2",
                        text: "#2d2d2d",
                        "text-muted": "#8b8577",
                        border: "#dcd6c8",
                        black: "#2d2d2d",
                        white: "#ffffff",
                        primary: "#d97a66" // Soft terracotta
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "lg": "24px",
                        "margin-mobile": "20px",
                        "base": "4px",
                        "gutter": "16px",
                        "xs": "8px",
                        "sm": "12px",
                        "margin-desktop": "32px",
                        "md": "16px",
                        "xl": "48px"
                    },
                    fontFamily: {
                        "headline-md-mobile": ["Inter", "-apple-system", "sans-serif"],
                        "display-lg": ["Inter", "-apple-system", "sans-serif"],
                        "headline-md": ["Inter", "-apple-system", "sans-serif"],
                        "label-mono": ["JetBrains Mono", "monospace"],
                        "body-base": ["Inter", "-apple-system", "sans-serif"]
                    },
                    boxShadow: {
                        'apple': '0 4px 24px rgba(45,45,45,0.06), 0 1px 2px rgba(45,45,45,0.03)',
                        'apple-lg': '0 8px 32px rgba(45,45,45,0.1), 0 2px 4px rgba(45,45,45,0.03)'
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f5f0e6;
            color: #2d2d2d;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: max(884px, 100dvh);
        }

        .glass-header {
            background: rgba(245, 240, 230, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(45,45,45,0.05);
        }

        .apple-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 4px 24px rgba(45,45,45,0.06), 0 1px 2px rgba(45,45,45,0.03);
            border: 1px solid rgba(45,45,45,0.04);
        }

        .timeline-line-apple { 
            position: absolute;
            left: 23px;
            top: 24px;
            bottom: 24px;
            width: 2px;
            background-color: #dcd6c8;
            z-index: 0;
        }

        /* Micro-interactions */
        .btn-hover {
            transition: all 0.2s ease;
        }
        .btn-hover:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body class="w-full flex flex-col font-body-base bg-background h-screen">
<!-- TopAppBar -->
<header class="glass-header flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 z-50 sticky top-0 shrink-0">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-text text-2xl">package_2</span>
<span class="font-headline-md-mobile md:font-headline-md text-lg font-semibold tracking-tight text-text">PARCEL</span>
</div>
<div class="flex items-center">
<button aria-label="Refresh" class="w-10 h-10 rounded-full flex items-center justify-center bg-black/5 hover:bg-black/10 transition-colors btn-hover text-text" onclick="animateRefresh()">
<span class="material-symbols-outlined text-xl">refresh</span>
</button>
</div>
</header>
<!-- Main Content - 3 Sections -->
<main class="flex-grow w-full max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop py-md pb-safe flex flex-col gap-md h-full overflow-y-auto">
<!-- TOP SECTION: Inputs -->
<section class="apple-card p-6 flex flex-col gap-4 shrink-0">
<div class="flex flex-col gap-1">
<label class="text-xs font-semibold text-text-muted uppercase tracking-wider">UID Colis</label>
<input class="bg-surface-alt border-none rounded-xl text-lg font-medium focus:ring-2 focus:ring-primary/20 w-full py-3 px-4 text-text placeholder:text-text-muted" placeholder="FR-993-X" type="text" value="FR-993-X"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-xs font-semibold text-text-muted uppercase tracking-wider">Code Secret</label>
<div class="relative w-full">
<input class="bg-surface-alt border-none rounded-xl text-lg font-medium focus:ring-2 focus:ring-primary/20 w-full py-3 px-4 text-text placeholder:text-text-muted tracking-widest" placeholder="••••" type="password" value="1234"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-text-muted hover:text-text transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<button class="mt-2 bg-primary text-white rounded-xl py-4 font-semibold text-base btn-hover shadow-apple-lg flex items-center justify-center gap-2">
<span>Track Parcel</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</section>
<!-- MIDDLE SECTION: Squares -->
<section class="grid grid-cols-2 gap-md shrink-0 h-48 md:h-56">
<!-- Left Square: Timestamp -->
<div class="apple-card p-5 flex flex-col justify-between h-full">
<div class="flex items-center gap-2 text-text-muted">
<span class="material-symbols-outlined text-xl">schedule</span>
<span class="text-xs font-semibold uppercase tracking-wider">Last Update</span>
</div>
<div class="flex flex-col gap-1">
<div class="text-3xl md:text-4xl font-bold tracking-tight text-text">14:00</div>
<div class="text-sm font-medium text-text-muted">13 May 2024</div>
</div>
</div>
<!-- Right Square: Status -->
<div class="apple-card p-5 flex flex-col justify-between h-full bg-primary text-white">
<div class="flex items-center gap-2 text-white/80">
<span class="material-symbols-outlined text-xl">local_shipping</span>
<span class="text-xs font-semibold uppercase tracking-wider">Status</span>
</div>
<div class="flex flex-col gap-1">
<div class="text-2xl md:text-3xl font-extrabold tracking-tight leading-tight">EXPÉDIÉ</div>
<div class="text-sm font-medium text-white/80">In transit</div>
</div>
</div>
</section>
<!-- BOTTOM SECTION: Simplified Flow -->
<section class="apple-card p-2 md:p-6 flex-grow flex flex-col relative overflow-hidden min-h-[300px]">
<div class="p-4 md:p-0">
<h2 class="text-xs font-semibold text-text-muted uppercase tracking-wider mb-6 md:mb-8">Journey</h2>
<div class="relative flex flex-col gap-8 md:gap-10 pb-4 z-10">
<!-- Vertical Line -->
<div class="timeline-line-apple hidden sm:block"></div>
<!-- Flow Node: DEPOT -->
<div class="flex items-center gap-4 md:gap-6 relative z-10 opacity-70">
<div class="w-12 h-12 rounded-full bg-surface-alt flex items-center justify-center shrink-0 border border-border">
<span class="material-symbols-outlined text-text-muted text-xl">check</span>
</div>
<div class="flex-grow">
<p class="text-sm font-bold text-text uppercase tracking-wide">DÉPÔT</p>
<p class="text-sm text-text-muted mt-0.5">Centre de tri local</p>
</div>
</div>
<!-- Flow Node: EXPEDIE (ACTIVE) -->
<div class="flex items-center gap-4 md:gap-6 relative z-10">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-apple">
<span class="material-symbols-outlined text-white text-xl">flight_takeoff</span>
</div>
<div class="flex-grow">
<p class="text-lg font-bold text-text tracking-tight">EXPÉDIÉ</p>
<p class="text-sm font-medium text-text-muted mt-0.5">En transit international</p>
</div>
</div>
<!-- Flow Node: A DESTINATION -->
<div class="flex items-center gap-4 md:gap-6 relative z-10 opacity-40">
<div class="w-12 h-12 rounded-full bg-surface-alt flex items-center justify-center shrink-0 border border-border border-dashed">
<span class="material-symbols-outlined text-text-muted text-xl">location_on</span>
</div>
<div class="flex-grow">
<p class="text-sm font-bold text-text-muted uppercase tracking-wide">À DESTINATION</p>
</div>
</div>
<!-- Flow Node: LIVRE -->
<div class="flex items-center gap-4 md:gap-6 relative z-10 opacity-40">
<div class="w-12 h-12 rounded-full bg-surface-alt flex items-center justify-center shrink-0 border border-border border-dashed">
<span class="material-symbols-outlined text-text-muted text-xl">inventory_2</span>
</div>
<div class="flex-grow">
<p class="text-sm font-bold text-text-muted uppercase tracking-wide">LIVRÉ</p>
</div>
</div>
</div>
</div>
</section>
</main>
<script>
        function animateRefresh() {
            const refreshBtn = document.querySelector('header button span.material-symbols-outlined');
            if (refreshBtn) {
                refreshBtn.classList.add('animate-spin');
                setTimeout(() => refreshBtn.classList.remove('animate-spin'), 1000);
            }
        }
    </script>
</body></html>
