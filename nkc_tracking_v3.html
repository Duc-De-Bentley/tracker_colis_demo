<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>Suivi d'envoi — NKC Express</title>

<!-- ⚠️ MAQUETTE UNIQUEMENT : Tailwind + Google Fonts en CDN.
     À inliner / auto-héberger avant toute mise en ligne (functionnal_specs_v7.md §12). -->
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script id="tailwind-config">
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          /* === Palette WhatsApp — v2 =====================================
             Écart vs v1 : le fond crème chaud (#f5f0e6) est remplacé par un
             neutre froid. Le crème désature le teal et le fait virer au terne ;
             le neutre froid le laisse franc.                                */
          background: "#f0f2f5",
          surface: "#ffffff",
          "surface-alt": "#e9edef",
          border: "#d9dee1",
          text: "#111b21",
          "text-muted": "#5e6b73",

          /* Un seul vert pour tout le parcours normal (100 → 400).
             Le vert vif #25D366 est délibérément écarté.                    */
          primary: "#128C7E",
          "primary-deep": "#0e6f64",   /* survol / connecteur, non exposé   */
          warn: "#B85C00"              /* retour expéditeur · annulation    */
        },
        fontFamily: {
          sans: ["Inter", "-apple-system", "sans-serif"],
          mono: ["JetBrains Mono", "monospace"]
        },
        boxShadow: {
          apple: "0 4px 24px rgba(17,27,33,.06), 0 1px 2px rgba(17,27,33,.03)",
          "apple-lg": "0 8px 28px rgba(18,140,126,.22), 0 2px 4px rgba(17,27,33,.04)"
        }
      }
    }
  }
</script>

<style>
  :root { color-scheme: light; }

  body {
    background-color: #f0f2f5;
    color: #111b21;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100dvh;
  }

  .glass-header {
    background: rgba(240, 242, 245, .85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(17, 27, 33, .06);
  }

  .apple-card {
    background-color: #ffffff;
    border-radius: 1.5rem;
    box-shadow: 0 4px 24px rgba(17,27,33,.06), 0 1px 2px rgba(17,27,33,.03);
    border: 1px solid rgba(17,27,33,.04);
  }

  /* Connecteur : plein jusqu'au nœud atteint, pointillé au-delà.
     Centré à 24px = centre exact des pastilles de 48px. */
  .connector {
    position: absolute;
    left: 23px;
    top: 3rem;
    bottom: -0.25rem;
    width: 2px;
    z-index: 0;
  }
  .connector--done   { background-color: #128C7E; } /* valeur par défaut, écrasée en inline si l'étape ciblée est "Livré" */
  .connector--future {
    background-image: linear-gradient(to bottom, #d9dee1 55%, transparent 55%);
    background-size: 2px 8px;
    background-repeat: repeat-y;
  }

  .btn-hover { transition: all .2s ease; }
  .btn-hover:active { transform: scale(.97); opacity: .85; }

  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .pb-safe { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
  }

  @keyframes spin-once { to { transform: rotate(360deg); } }
  .spinning { animation: spin-once .8s linear infinite; }

  .skeleton {
    background: linear-gradient(90deg, #e9edef 25%, #f3f6f7 50%, #e9edef 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>

<body class="w-full flex flex-col font-sans bg-background min-h-screen">

<!-- ================= EN-TÊTE ================= -->
<header class="glass-header flex justify-between items-center w-full px-5 md:px-8 h-16 z-50 sticky top-0 shrink-0">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-primary text-2xl">package_2</span>
    <span class="text-lg font-semibold tracking-tight text-text">NKC Express</span>
  </div>
  <button id="btn-refresh" aria-label="Actualiser le suivi" title="Actualiser"
          class="hidden w-10 h-10 rounded-full items-center justify-center bg-black/5 hover:bg-black/10 transition-colors btn-hover text-text">
    <span class="material-symbols-outlined text-xl">refresh</span>
  </button>
</header>

<main class="flex-grow w-full max-w-2xl mx-auto px-5 md:px-8 py-6 pb-safe flex flex-col gap-4">

  <!-- ===== ÉCRAN 1 — DÉVERROUILLAGE ===== -->
  <section id="screen-unlock" class="apple-card p-6 md:p-8 flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <h1 class="text-2xl font-bold tracking-tight text-text">Suivre mon envoi</h1>
      <p class="text-sm text-text-muted leading-relaxed">
        La référence et le code figurent sur le ticket qui vous a été remis à l'agence.
      </p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="input-ref" class="text-sm font-semibold text-text">Référence de l'envoi</label>
      <input id="input-ref" type="text" inputmode="text" autocomplete="off" spellcheck="false"
             placeholder="NKC-260824-007"
             class="bg-surface-alt border-none rounded-xl font-mono text-lg tracking-wide w-full py-3.5 px-4 text-text placeholder:text-text-muted/60 focus:ring-2 focus:ring-primary/40 uppercase">
    </div>

    <div class="flex flex-col gap-2">
      <label for="input-code" class="text-sm font-semibold text-text">Code de suivi</label>
      <input id="input-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8"
             autocomplete="off" spellcheck="false" placeholder="8 chiffres"
             class="bg-surface-alt border-none rounded-xl font-mono text-lg tracking-[.3em] w-full py-3.5 px-4 text-text placeholder:text-text-muted/60 placeholder:tracking-normal focus:ring-2 focus:ring-primary/40">
    </div>

    <div id="unlock-error" class="hidden items-start gap-2.5 rounded-xl bg-warn/10 border border-warn/25 px-4 py-3">
      <span class="material-symbols-outlined text-warn text-xl shrink-0">error</span>
      <p id="unlock-error-text" class="text-sm text-text leading-relaxed"></p>
    </div>

    <button id="btn-track"
            class="mt-1 bg-primary text-white rounded-xl py-4 font-semibold text-base btn-hover shadow-apple-lg flex items-center justify-center gap-2 disabled:opacity-50">
      <span id="btn-track-label">Afficher le suivi</span>
      <span id="btn-track-icon" class="material-symbols-outlined text-lg">arrow_forward</span>
    </button>
  </section>

  <!-- ===== ÉCRAN 2 — CHARGEMENT ===== -->
  <section id="screen-loading" class="hidden flex-col gap-4">
    <div class="apple-card p-6 flex flex-col gap-4">
      <div class="skeleton h-4 w-24 rounded"></div>
      <div class="skeleton h-9 w-2/3 rounded"></div>
      <div class="skeleton h-4 w-1/2 rounded"></div>
    </div>
    <div class="apple-card p-6 flex flex-col gap-6">
      <div class="skeleton h-4 w-20 rounded"></div>
      <div class="skeleton h-12 w-full rounded-xl"></div>
      <div class="skeleton h-12 w-full rounded-xl"></div>
      <div class="skeleton h-12 w-full rounded-xl"></div>
    </div>
  </section>

  <!-- ===== ÉCRAN 3 — RÉSULTAT ===== -->
  <section id="screen-result" class="hidden flex-col gap-4">

    <div id="status-band" class="apple-card p-6 md:p-7 flex flex-col gap-5">
      <div class="flex items-start justify-between gap-4">
        <div class="flex flex-col gap-1 min-w-0">
          <span id="status-eyebrow" class="text-xs font-semibold uppercase tracking-wider" style="opacity:.8">Statut</span>
          <h2 id="status-label" class="text-3xl md:text-4xl font-extrabold tracking-tight leading-tight break-words"></h2>
        </div>
        <span id="status-icon" class="material-symbols-outlined text-4xl shrink-0" style="opacity:.9"></span>
      </div>

      <p id="status-detail" class="text-base font-medium leading-relaxed" style="opacity:.92"></p>

      <div id="status-foot" class="flex flex-wrap items-center gap-x-3 gap-y-1.5 pt-1" style="border-top:1px solid color-mix(in srgb, currentColor 28%, transparent)">
        <div class="flex items-center gap-2 pt-3">
          <span id="route-origin" class="text-sm font-semibold"></span>
          <span class="material-symbols-outlined text-base" style="opacity:.75">arrow_right_alt</span>
          <span id="route-destination" class="text-sm font-semibold"></span>
        </div>
        <span id="last-update" class="text-xs font-medium font-mono pt-3" style="opacity:.8"></span>
      </div>
    </div>

    <div class="apple-card px-6 py-4 flex items-center justify-between gap-4">
      <div class="flex flex-col gap-0.5 min-w-0">
        <span class="text-sm font-semibold text-text">Référence</span>
        <span id="result-ref" class="font-mono text-base font-medium text-text-muted tracking-wide truncate"></span>
      </div>
      <button id="btn-change" class="text-sm font-semibold text-primary hover:underline btn-hover shrink-0">
        Changer
      </button>
    </div>

    <div class="apple-card p-6 md:p-7">
      <h3 class="text-sm font-semibold text-text mb-6">Parcours</h3>
      <ol id="timeline" class="relative flex flex-col"></ol>
    </div>
  </section>

  <!-- ===== ÉCRAN 4 — BLOCAGE ===== -->
  <section id="screen-blocked" class="hidden apple-card p-8 flex-col items-center text-center gap-4">
    <span class="material-symbols-outlined text-5xl text-warn">lock_clock</span>
    <h2 class="text-xl font-bold tracking-tight text-text">Trop de tentatives</h2>
    <p id="blocked-text" class="text-sm text-text-muted leading-relaxed max-w-sm"></p>
    <button id="btn-blocked-back" class="mt-2 bg-surface-alt text-text rounded-xl py-3 px-6 font-semibold text-sm btn-hover">
      Revenir
    </button>
  </section>

  <p class="text-xs text-text-muted text-center mt-2 leading-relaxed">
    Une question sur votre envoi&nbsp;? Contactez l'agence de dépôt.
  </p>
</main>

<div id="live-region" aria-live="polite" class="sr-only"></div>

<script>
/* =========================================================================
   NKC Express — Page de suivi · v3 (thème WhatsApp, ton "arrival" dédié)
   Structure, typographie et logique identiques à v1. Seule la couche
   chromatique change. Données simulées : le backend n'existe pas encore
   (api_contract_v6.md §4 · GET /tracking/:base_uid?c=<code>).
   ========================================================================= */

// === DEBUT BLOC : Référentiel des statuts ===
// ⚠️ Écart v1 → v2 : le statut 400 passe du ton « done » au ton « primary ».
// Un seul vert couvre désormais 100 → 400 ; seuls 900 et 999 s'en distinguent.
const STATUSES = {
  100: { label: "Déposé",        icon: "publish",        tone: "primary", detail: (o, d) => `Enregistré à ${o}, en attente de départ vers ${d}.` },
  200: { label: "Expédié",       icon: "flight_takeoff", tone: "primary", detail: (o, d) => `En transit vers ${d}.` },
  300: { label: "Disponible",    icon: "flight_land",    tone: "primary", detail: (o, d) => `Arrivé à ${d}, prêt à être retiré.` },
  350: { label: "En livraison",  icon: "local_shipping", tone: "primary", detail: (o, d) => `En tournée de livraison à ${d}.` },
  // Seul statut hors de la charte teal partagée : vert vif, texte sombre.
  // Décision validée sur nkc_tracking_whatsapp_demo_v3.html.
  400: { label: "Livré",         icon: "inventory_2",    tone: "arrival", detail: (o, d) => `Remis au destinataire à ${d}.` },
  900: { label: "Retour",        icon: "undo",           tone: "warn",    detail: (o, d) => `Renvoyé à l'expéditeur, à ${o}.` },
  999: { label: "Annulé",        icon: "cancel",         tone: "warn",    detail: () => `Cet envoi a été annulé.` }
};

// Chaque ton porte bg (fond) + fg (texte) + dot (couleur pleine des pastilles/connecteurs).
// "arrival" est le seul en texte sombre : #00C566 ne supporte pas le blanc
// (contraste ~1,8:1). Vérifié : #00C566 / #052E19 → 6,5:1 (AA).
const TONES = {
  primary: { bg: "#128C7E", fg: "#ffffff", dot: "#128C7E" },
  arrival: { bg: "#00C566", fg: "#052E19", dot: "#00C566" },
  warn:    { bg: "#B85C00", fg: "#ffffff", dot: "#B85C00" }
};

const NORMAL_FLOW = [100, 200, 300, 400];
const CITIES = { paris: "Paris", nouakchott: "Nouakchott" };
// === FIN BLOC : Référentiel des statuts ===


// === DEBUT BLOC : Jeu de données simulé ===
const MOCK = {
  "NKC-260824-007": {
    code: "41528096", status: 200, origin_city: "paris", destination_city: "nouakchott",
    history: [
      { status: 100, date: "2026-08-24T14:30:00" },
      { status: 200, date: "2026-08-25T09:15:00" }
    ]
  },
  "NKC-260827-002": {
    code: "10293847", status: 100, origin_city: "paris", destination_city: "nouakchott",
    history: [ { status: 100, date: "2026-08-27T10:05:00" } ]
  },
  "NKC-260812-014": {
    code: "77451230", status: 400, origin_city: "nouakchott", destination_city: "paris",
    history: [
      { status: 100, date: "2026-08-12T11:00:00" },
      { status: 200, date: "2026-08-13T08:40:00" },
      { status: 300, date: "2026-08-18T15:20:00" },
      { status: 400, date: "2026-08-19T17:05:00" }
    ]
  },
  "NKC-260818-009": { // disponible — arrivé à destination, pas encore retiré
    code: "63820147", status: 300, origin_city: "paris", destination_city: "nouakchott",
    history: [
      { status: 100, date: "2026-08-18T10:15:00" },
      { status: 200, date: "2026-08-19T07:30:00" },
      { status: 300, date: "2026-08-24T13:50:00" }
    ]
  },
  "NKC-260805-003": {
    code: "55512348", status: 900, origin_city: "paris", destination_city: "nouakchott",
    history: [
      { status: 100, date: "2026-08-05T09:30:00" },
      { status: 200, date: "2026-08-06T07:50:00" },
      { status: 900, date: "2026-08-20T13:10:00" }
    ]
  }
};

const LATENCY_MS = 700;
const MAX_ATTEMPTS = 5;
let failedAttempts = 0;
let currentRef = null;
let currentCode = null;

function fetchTracking(ref, code) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (failedAttempts >= MAX_ATTEMPTS) return reject({ code: "RATE_LIMITED" });
      const row = MOCK[ref];
      // Message uniforme : ne révèle pas laquelle des deux valeurs est fausse.
      if (!row || row.code !== code) {
        failedAttempts++;
        return reject({ code: "NOT_FOUND" });
      }
      failedAttempts = 0;
      resolve({
        status: row.status,
        status_history: row.history,
        origin_city: row.origin_city,
        destination_city: row.destination_city
      });
    }, LATENCY_MS);
  });
}
// === FIN BLOC : Jeu de données simulé ===


// === DEBUT BLOC : Utilitaires ===
const $ = (id) => document.getElementById(id);

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" })
       + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function formatShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit" })
       + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function showScreen(name) {
  ["screen-unlock", "screen-loading", "screen-result", "screen-blocked"].forEach((id) => {
    const el = $(id);
    const on = id === "screen-" + name;
    el.classList.toggle("hidden", !on);
    el.classList.toggle("flex", on);
  });
  $("btn-refresh").classList.toggle("hidden", name !== "result");
  $("btn-refresh").classList.toggle("flex", name === "result");
}

function announce(msg) { $("live-region").textContent = msg; }
// === FIN BLOC : Utilitaires ===


// === DEBUT BLOC : Rendu de la frise ===
function renderTimeline(data) {
  const origin = CITIES[data.origin_city] || data.origin_city;
  const destination = CITIES[data.destination_city] || data.destination_city;
  const reached = new Map(data.status_history.map((h) => [h.status, h.date]));

  const exceptional = data.status_history
    .map((h) => h.status)
    .filter((s) => !NORMAL_FLOW.includes(s));

  let steps = [...NORMAL_FLOW];
  if (reached.has(350)) steps.splice(steps.indexOf(400), 0, 350);
  if (exceptional.length) {
    steps = steps.filter((s) => reached.has(s)).concat(exceptional);
  }

  const lastReachedIndex = steps.reduce((acc, s, i) => (reached.has(s) ? i : acc), -1);

  $("timeline").innerHTML = steps.map((code, i) => {
    const st = STATUSES[code];
    const isReached = reached.has(code);
    const isCurrent = i === lastReachedIndex;
    const isLast = i === steps.length - 1;
    const tone = TONES[st.tone];

    // Le connecteur porte la couleur de l'étape qu'il MÈNE VERS : le segment qui
    // aboutit à "Livré" doit être vert vif, pas teal, même s'il part d'une étape teal.
    const nextTone = !isLast ? TONES[STATUSES[steps[i + 1]]?.tone] : null;
    const connColor = (i < lastReachedIndex && nextTone) ? nextTone.bg : null;
    const connector = isLast ? ""
      : `<span class="connector ${i < lastReachedIndex ? "connector--done" : "connector--future"}"${connColor ? ` style="background-color:${connColor}"` : ""}></span>`;

    const dotStyle = isCurrent
      ? `background-color:${tone.dot};`
      : isReached
        ? `background-color:${tone.dot}1f;border:2px solid ${tone.dot};`
        : "background-color:#e9edef;border:2px dashed #d9dee1;";

    const iconColor = isCurrent ? tone.fg : isReached ? tone.dot : "#5e6b73";
    const dim = isReached ? "" : "opacity-[.65]";

    // Aucune date sur les étapes à venir : l'API ne renvoie que le passé.
    const dateLine = isReached
      ? `<p class="text-xs font-medium text-text-muted mt-1.5 font-mono">${formatShort(reached.get(code))}</p>`
      : `<p class="text-xs font-medium text-text-muted mt-1.5">À venir</p>`;

    return `
      <li class="relative pl-16 ${isLast ? "" : "pb-8"} ${dim}">
        ${connector}
        <span class="absolute left-0 top-0 w-12 h-12 rounded-full flex items-center justify-center z-10" style="${dotStyle}">
          <span class="material-symbols-outlined text-xl" style="color:${iconColor}">${st.icon}</span>
        </span>
        <div class="pt-1.5">
          <p class="${isCurrent ? "text-lg font-bold" : "text-base font-semibold"} tracking-tight text-text">${st.label}</p>
          <p class="text-sm text-text-muted mt-0.5 leading-relaxed">${st.detail(origin, destination)}</p>
          ${dateLine}
        </div>
      </li>`;
  }).join("");
}
// === FIN BLOC : Rendu de la frise ===


// === DEBUT BLOC : Rendu du résultat ===
function renderResult(data) {
  const st = STATUSES[data.status];
  const tone = TONES[st.tone];
  const origin = CITIES[data.origin_city] || data.origin_city;
  const destination = CITIES[data.destination_city] || data.destination_city;
  const last = data.status_history[data.status_history.length - 1];

  $("status-band").style.backgroundColor = tone.bg;
  $("status-band").style.color = tone.fg;
  $("status-band").style.borderColor = "transparent";
  $("status-label").textContent = st.label;
  $("status-icon").textContent = st.icon;
  $("status-detail").textContent = st.detail(origin, destination);
  $("route-origin").textContent = origin;
  $("route-destination").textContent = destination;
  $("last-update").textContent = "Mis à jour le " + formatDate(last.date);
  $("result-ref").textContent = currentRef;

  renderTimeline(data);
  showScreen("result");
  announce(`Statut de l'envoi : ${st.label}. ${st.detail(origin, destination)}`);
}
// === FIN BLOC : Rendu du résultat ===


// === DEBUT BLOC : Contrôleur ===
function showUnlockError(msg) {
  $("unlock-error-text").textContent = msg;
  $("unlock-error").classList.remove("hidden");
  $("unlock-error").classList.add("flex");
  announce(msg);
}

function clearUnlockError() {
  $("unlock-error").classList.add("hidden");
  $("unlock-error").classList.remove("flex");
}

function setTracking(busy) {
  $("btn-track").disabled = busy;
  $("btn-track-label").textContent = busy ? "Vérification…" : "Afficher le suivi";
  $("btn-track-icon").textContent = busy ? "progress_activity" : "arrow_forward";
  $("btn-track-icon").classList.toggle("spinning", busy);
}

function lookup(ref, code, { silent = false } = {}) {
  clearUnlockError();
  if (!silent) { setTracking(true); showScreen("loading"); }

  fetchTracking(ref, code)
    .then((data) => {
      currentRef = ref;
      currentCode = code;
      renderResult(data);
    })
    .catch((err) => {
      if (err.code === "RATE_LIMITED") {
        $("blocked-text").textContent =
          "Par sécurité, l'accès au suivi est temporairement suspendu. Réessayez dans quelques minutes, ou contactez l'agence de dépôt.";
        showScreen("blocked");
        announce("Accès temporairement suspendu.");
        return;
      }
      showScreen("unlock");
      showUnlockError("Référence ou code de suivi incorrect. Vérifiez les deux valeurs sur votre ticket.");
    })
    .finally(() => setTracking(false));
}

$("btn-track").addEventListener("click", () => {
  const ref = $("input-ref").value.trim().toUpperCase();
  const code = $("input-code").value.trim();
  if (!ref || !code) {
    showUnlockError("Renseignez la référence et le code de suivi.");
    return;
  }
  lookup(ref, code);
});

[$("input-ref"), $("input-code")].forEach((input) => {
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-track").click(); });
  input.addEventListener("input", clearUnlockError);
});

$("input-code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 8);
});

$("btn-change").addEventListener("click", () => {
  $("input-code").value = "";
  clearUnlockError();
  showScreen("unlock");
  $("input-ref").focus();
});

$("btn-blocked-back").addEventListener("click", () => {
  failedAttempts = 0;
  showScreen("unlock");
});

$("btn-refresh").addEventListener("click", () => {
  if (!currentRef) return;
  const icon = $("btn-refresh").querySelector("span");
  icon.classList.add("spinning");
  fetchTracking(currentRef, currentCode)
    .then(renderResult)
    .catch(() => announce("Actualisation impossible."))
    .finally(() => icon.classList.remove("spinning"));
});

// === Ouverture par QR : …/track/{base_uid}?c={code} ===
(function initFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("c");
  const path = window.location.pathname.split("/").filter(Boolean);
  const ref = params.get("ref") || (path.length ? decodeURIComponent(path[path.length - 1]).toUpperCase() : null);

  if (ref && code && /^NKC-\d{6}-\d{3}$/.test(ref)) {
    $("input-ref").value = ref;
    $("input-code").value = code;
    showScreen("loading");
    lookup(ref, code, { silent: true });
    history.replaceState(null, "", window.location.pathname);
    return;
  }
  showScreen("unlock");
})();
// === FIN BLOC : Contrôleur ===
</script>
